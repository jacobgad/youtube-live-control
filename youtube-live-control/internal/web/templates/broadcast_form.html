{{define "content"}}
{{with .Data}}
<div class="card">
<form method="post" action="{{$.Base}}/broadcasts/{{if .ID}}{{.ID}}{{else}}new{{end}}" enctype="multipart/form-data">

<div class="field">
<label for="title">Title{{if .Lifecycle}} <span class="badge">{{.Lifecycle}}</span>{{end}}</label>
<input type="text" id="title" name="title" value="{{.Title}}" maxlength="100" required>
</div>

<div class="field">
<label for="description">Description</label>
<textarea id="description" name="description" maxlength="5000">{{.Description}}</textarea>
</div>

<div class="row">
<div class="field">
<label for="start">Scheduled start</label>
<input type="datetime-local" id="start" name="start" value="{{inputTime .Start}}" required>
</div>
<div class="field">
<label for="privacy">Privacy</label>
<select id="privacy" name="privacy">
<option value="public" {{if eq .Privacy "public"}}selected{{end}}>Public</option>
<option value="unlisted" {{if eq .Privacy "unlisted"}}selected{{end}}>Unlisted</option>
<option value="private" {{if eq .Privacy "private"}}selected{{end}}>Private</option>
</select>
</div>
</div>

<div class="field">
<label for="stream_id">Stream key</label>
<select id="stream_id" name="stream_id" {{if not .ID}}required{{end}}>
{{if .ID}}<option value="" {{if not .StreamID}}selected{{end}}>{{if .StreamID}}Keep current{{else}}— none bound —{{end}}</option>{{end}}
{{range .Streams}}<option value="{{.ID}}" {{if eq .ID $.Data.StreamID}}selected{{end}}>{{.Title}} · {{.Resolution}}{{if .FrameRate}} {{.FrameRate}}{{end}} · key {{keySuffix .StreamKey}}</option>{{end}}
</select>
<p class="hint">The key OBS streams to. Without one the broadcast can never go live.</p>
</div>

<div class="field">
<label>Thumbnail</label>
{{template "picker" (picker $.Base .Images .ImageID (ne .ID "") .ThumbnailURL)}}
</div>

<input type="hidden" name="preset_id" value="{{.PresetID}}">
<div class="actions">
<button type="submit" class="primary">{{if .ID}}Save{{else}}Schedule{{end}}</button>
<a class="button quiet" href="{{$.Base}}/broadcasts">Cancel</a>
{{if .ID}}
<span class="spacer"></span>
<button type="submit" class="danger" form="delete-{{.ID}}">Delete</button>
{{end}}
</div>
</form>
{{if .ID}}
<form id="delete-{{.ID}}" method="post" action="{{$.Base}}/broadcasts/{{.ID}}/delete" onsubmit="return confirm('Delete “{{.Title}}” from YouTube? This cannot be undone.');"></form>
{{end}}
</div>
{{end}}
{{end}}
