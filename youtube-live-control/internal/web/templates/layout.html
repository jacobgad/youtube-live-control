<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{.Title}} · YouTube Live Control</title>
<link rel="stylesheet" href="{{.Base}}/static/app.css">
</head>
<body>
<header>
<h1>YouTube Live Control</h1>
{{if .Channel}}<span class="channel">{{.Channel}}</span>{{end}}
<nav>
{{if .Authorized}}
<a href="{{.Base}}/broadcasts" {{if or (eq .Tab "broadcasts") (eq .Tab "broadcast_form")}}class="active"{{end}}>Broadcasts</a>
<a href="{{.Base}}/presets" {{if or (eq .Tab "presets") (eq .Tab "preset_form")}}class="active"{{end}}>Presets</a>
<a href="{{.Base}}/images" {{if eq .Tab "images"}}class="active"{{end}}>Images</a>
{{end}}
<a href="{{.Base}}/connection" {{if eq .Tab "connection"}}class="active"{{end}}>Connection</a>
</nav>
</header>
<main>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Notice}}<p class="notice">{{.Notice}}</p>{{end}}
{{template "content" .}}
</main>
<script>
document.addEventListener('submit', function () {
  document.querySelectorAll('button[type=submit], .button').forEach(function (b) {
    b.disabled = true;
    b.classList.add('busy');
  });
});
</script>
</body>
</html>
