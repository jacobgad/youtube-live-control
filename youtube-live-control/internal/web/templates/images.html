{{define "content"}}
{{with .Data}}
<div class="card">
<form method="post" action="{{$.Base}}/images" enctype="multipart/form-data" class="row end">
<div class="field">
<label for="thumbnail">Upload</label>
<input type="file" id="thumbnail" name="thumbnail" accept="image/jpeg,image/png" required>
</div>
<button type="submit" class="primary">Upload</button>
</form>
<p class="hint">JPEG or PNG up to 2 MB, ideally 1280×720.</p>
</div>
{{if not .Images}}<div class="card muted">No images yet.</div>{{end}}
<div class="gallery">
{{range .Images}}
<div class="card gallery-item">
<img src="{{$.Base}}/images/{{.ID}}" alt="">
<div class="gallery-meta">
<span class="muted">{{kb .Size}} · {{if eq .UsedBy 0}}not used{{else if eq .UsedBy 1}}1 preset{{else}}{{.UsedBy}} presets{{end}}</span>
<form class="inline" method="post" action="{{$.Base}}/images/{{.ID}}/delete" onsubmit="return confirm('Delete this image?');">
<button type="submit" class="danger small" {{if gt .UsedBy 0}}disabled title="Used by a preset"{{end}}>Delete</button>
</form>
</div>
</div>
{{end}}
</div>
{{end}}
{{end}}
