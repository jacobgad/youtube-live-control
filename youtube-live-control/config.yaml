name: YouTube Live Control
version: "1.5.1"
slug: youtube_live_control
description: Schedule YouTube live streams from presets, then go live and end them from one Home Assistant panel
url: https://github.com/jacobgad/youtube-live-control
arch:
  - aarch64
  - amd64
homeassistant: 2026.5.0
services:
  - mqtt:need
ingress: true
panel_icon: mdi:youtube
panel_title: YouTube Live
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: OAuth redirect endpoint; only reached directly when external_url points an https proxy at it
options:
  google_client_id: ""
  google_client_secret: ""
  external_url: ""
  list_poll_minutes: 5
  fast_poll_seconds: 3
  fast_mode_minutes: 5
  live_poll_seconds: 60
  idle_poll_minutes: 10
  log_level: info
schema:
  google_client_id: str
  google_client_secret: password
  external_url: str?
  list_poll_minutes: int(1,60)
  fast_poll_seconds: int(1,30)
  fast_mode_minutes: int(1,60)
  live_poll_seconds: int(15,600)
  idle_poll_minutes: int(1,60)
  log_level: list(debug|info|warn|error)
